spring:
  datasource:
    url: jdbc:mysql://${AUTH_DB_HOST}:${AUTH_SERVICE_PORT}/${AUTH_DB_DATABASE}
    username: ${AUTH_DB_USERNAME}
    password: ${AUTH_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

server:
  port: ${AUTH_SERVICE_PORT}

jwt:
  secret: ${AUTH_SERVICE_JWT_SECRET}
  expiration: ${AUTH_SERVICE_JWT_EXPIRATION}