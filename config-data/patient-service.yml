spring:
  datasource:
    url: jdbc:mysql://${PATIENT_DB_HOST}:${PATIENT_DB_PORT}/${PATIENT_DB_DATABASE}
    username: ${PATIENT_DB_USERNAME}
    password: ${PATIENT_DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: update

server:
  port: ${PATIENT_SERVER_PORT}